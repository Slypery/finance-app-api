opencollection: 1.0.0

info:
  name: finance_app_api
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  auth:
    type: bearer
    token: "{{AccessToken}}"
  variables:
    - name: HostName
      value: localhost:3000
    - name: WorkspaceId
      value: ""
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
