info:
  name: refresh access token
  type: http
  seq: 1

http:
  method: POST
  url: "{{HostName}}/api/auth/refresh-access-token"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) {
          bru.setEnvVar('AccessToken', res.body.data.accessToken)
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
